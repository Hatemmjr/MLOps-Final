name: MLOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Stage 1 — Lint
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: "1 · Lint (ruff + flake8)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: pip install ruff==0.4.4 flake8==7.0.0

      - name: Run ruff
        run: ruff check src/ tests/ monitoring/

      - name: Run flake8
        run: flake8 src/ tests/ monitoring/ --max-line-length=100 --extend-ignore=E203,W503

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 2 — Unit Tests with coverage gate
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "2 · Unit Tests (coverage ≥ 70 %)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/unit/ tests/data/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 3 — Data Validation (schema + quality checks)
  # ──────────────────────────────────────────────────────────────────────────
  data-validation:
    name: "3 · Data Validation (pandera schema)"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic dataset for CI
        run: python src/data/prepare.py

      - name: Run data schema tests
        run: pytest tests/data/ -v

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 4 — Model Validation (performance threshold gate)
  # ──────────────────────────────────────────────────────────────────────────
  model-validation:
    name: "4 · Model Validation (roc_auc ≥ threshold)"
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pipeline (prepare → preprocess → featurize)
        run: |
          python src/data/prepare.py
          python src/data/preprocess.py
          python src/features/featurize.py

      - name: Start MLflow server in background
        run: |
          mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlartifacts \
            --port 5000 &
          sleep 5

      - name: Train models and register best to Production
        run: python src/training/train.py

      - name: Validate Production model meets thresholds
        run: python src/evaluation/evaluate.py

      - name: Run API tests
        run: pytest tests/test_api.py -v

  # ──────────────────────────────────────────────────────────────────────────
  # Summary badge
  # ──────────────────────────────────────────────────────────────────────────
  ci-success:
    name: "✅ All CI stages passed"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, data-validation, model-validation]
    steps:
      - run: echo "All four CI stages passed successfully."
