name: MLOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Stage 1: Lint ────────────────────────────────────────────────────────
  lint:
    name: "1 · Lint (ruff + flake8)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install linters
        run: pip install ruff==0.4.4 flake8==7.0.0
      - name: Run ruff
        run: ruff check src/ tests/ monitoring/ --ignore E501
      - name: Run flake8
        run: flake8 src/ tests/ monitoring/ --max-line-length=100 --extend-ignore=E203,W503

  # ── Stage 2: Unit Tests ──────────────────────────────────────────────────
  unit-tests:
    name: "2 · Unit Tests (coverage >= 70%)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install scikit-learn==1.4.2 imbalanced-learn==0.12.3 pandas==2.2.2 \
            numpy==1.26.4 scipy==1.13.0 joblib==1.4.2 PyYAML==6.0.1 \
            pytest==8.2.0 pytest-cov==5.0.0 httpx==0.27.0 \
            fastapi==0.111.0 uvicorn==0.29.0 pydantic==2.7.1 \
            pandera==0.19.3 requests==2.32.3
      - name: Run unit tests with coverage
        run: |
          export PYTHONPATH=.
          pytest tests/unit/ tests/data/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

  # ── Stage 3: Data Validation ─────────────────────────────────────────────
  data-validation:
    name: "3 · Data Validation (pandera schema)"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install scikit-learn==1.4.2 imbalanced-learn==0.12.3 pandas==2.2.2 \
            numpy==1.26.4 scipy==1.13.0 joblib==1.4.2 PyYAML==6.0.1 \
            pytest==8.2.0 pandera==0.19.3
      - name: Generate synthetic dataset
        run: |
          export PYTHONPATH=.
          python -m src.data.prepare
      - name: Run schema tests
        run: |
          export PYTHONPATH=.
          pytest tests/data/ -v

  # ── Stage 4: Model Validation ────────────────────────────────────────────
  model-validation:
    name: "4 · Model Validation (roc_auc >= threshold)"
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install scikit-learn==1.4.2 imbalanced-learn==0.12.3 pandas==2.2.2 \
            numpy==1.26.4 scipy==1.13.0 joblib==1.4.2 PyYAML==6.0.1 \
            mlflow==2.13.0 optuna==3.6.1 \
            fastapi==0.111.0 uvicorn==0.29.0 pydantic==2.7.1 \
            pytest==8.2.0 pytest-cov==5.0.0 httpx==0.27.0 \
            pandera==0.19.3 requests==2.32.3
      - name: Run full pipeline
        run: |
          export PYTHONPATH=.
          python -m src.data.prepare
          python -m src.data.preprocess
          python -m src.features.featurize
      - name: Train and register model
        run: |
          export PYTHONPATH=.
          python -m src.training.train
      - name: Validate model meets thresholds
        run: |
          export PYTHONPATH=.
          python -m src.evaluation.evaluate
      - name: Run API tests
        run: |
          export PYTHONPATH=.
          pytest tests/test_api.py -v

  # ── Summary ──────────────────────────────────────────────────────────────
  ci-success:
    name: "All CI stages passed"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, data-validation, model-validation]
    steps:
      - run: echo "All four CI stages passed successfully."
